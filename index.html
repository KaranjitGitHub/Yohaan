<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02070d"><title>Yohaan // Level 04</title><style>*{box-sizing:border-box}html,body{margin:0;background:#02070d;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh;display:grid;place-items:center;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));overflow:hidden}.app{width:min(100%,430px);height:min(calc(100dvh - 20px),880px);display:grid;grid-template-rows:auto 1fr auto auto;gap:7px}.top{display:flex;justify-content:space-between;align-items:center;color:#80ebff;font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;padding:0 3px}.screen{position:relative;min-height:0;overflow:hidden;border-radius:18px;border:1px solid #25d8ff;background:radial-gradient(circle at 50% 35%,#07263a,#02080e 68%);box-shadow:0 0 28px rgba(36,211,255,.16),inset 0 0 26px rgba(36,211,255,.06);padding:14px;display:flex;flex-direction:column}.screen.green{border-color:#49ee65;background:radial-gradient(circle at 50% 45%,#06351b,#020b06 72%)}.screen.gold{border-color:#f3b91b;background:radial-gradient(circle at 50% 45%,#3c2504,#0b0701 72%)}.screen.red{border-color:#ff4f4f}.micro{font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;color:#7eeaff;text-align:center}.title{font:900 clamp(27px,8vw,42px) ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;line-height:.95;margin:8px 0;color:#f8fbff}.goldText{color:#f5b82a}.greenText{color:#61f37b}.cyan{color:#53e5ff}.panel{border:1px solid #185d77;background:rgba(2,13,20,.88);border-radius:13px;padding:12px}.heroLogo{font:900 clamp(54px,18vw,90px) ui-monospace;color:#f2b32a;text-align:center;line-height:1;text-shadow:0 0 24px rgba(242,179,42,.35)}.character{position:relative;flex:1;min-height:160px;margin:6px 0;border-radius:14px;overflow:hidden;border:1px solid #16546b;background:#02070d}.character:before{content:'';position:absolute;inset:0;background:url('invite.webp') center/cover no-repeat;filter:saturate(1.08) contrast(1.05)}.character:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(1,8,13,.7) 100%)}.orb{width:min(48vw,190px);aspect-ratio:1;margin:auto;border-radius:50%;border:2px solid #39ddff;box-shadow:0 0 32px rgba(57,221,255,.45),inset 0 0 30px rgba(57,221,255,.18);display:grid;place-items:center;position:relative}.orb:before,.orb:after{content:'';position:absolute;border-radius:50%;inset:13px;border:1px dashed #52e9ff;animation:spin 9s linear infinite}.orb:after{inset:32px;border-style:solid;animation-direction:reverse;animation-duration:6s}@keyframes spin{to{transform:rotate(360deg)}}.core{width:42px;height:42px;border-radius:50%;background:#dffbff;border:8px solid #27ceff;box-shadow:0 0 25px #27ceff}.bars{display:grid;gap:12px;margin:18px 0}.row{display:grid;grid-template-columns:1fr auto;gap:8px;font:800 11px ui-monospace;color:#7deeff}.bar{grid-column:1/-1;height:6px;border-radius:99px;background:#05202f;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#22cfff;box-shadow:0 0 10px #22cfff}.finger{font-size:min(35vw,150px);text-align:center;filter:drop-shadow(0 0 18px #20d8ff)}.scan{height:2px;background:#64ecff;box-shadow:0 0 14px #32d8ff;animation:scan 1.5s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(-50px)}50%{transform:translateY(50px)}}.shield{width:min(44vw,170px);aspect-ratio:.9;margin:auto;clip-path:polygon(50% 0,92% 16%,82% 72%,50% 100%,18% 72%,8% 16%);display:grid;place-items:center;background:linear-gradient(145deg,#86ff3f,#0e611d);box-shadow:0 0 35px rgba(84,255,75,.38);font:900 72px ui-monospace;color:#e8ffdf}.brief{display:grid;gap:9px;margin-top:10px}.brief .item{padding:10px 11px;border:1px solid #18526b;border-radius:10px;background:#04111a}.label{font:800 9px ui-monospace;color:#60e7ff;letter-spacing:.14em}.value{font-weight:800;font-size:14px;margin-top:3px}.controls{display:grid;gap:7px}.controls.two{grid-template-columns:1fr 1fr}button{appearance:none;min-height:46px;border:1px solid #2ad9ff;border-radius:11px;background:#062033;color:#fff;padding:9px 12px;font:900 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.03em}button.primary{background:#f2b426;color:#0e0b03;border-color:#ffd465}button.success{background:#37db42;color:#041005;border-color:#87ff8f}button.danger{background:#4f1010;color:#ffd9d9;border-color:#ff5757}.status{text-align:center;font-size:10px;color:#c0f3ff;min-height:14px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f2aa17;margin-right:5px;box-shadow:0 0 8px #f2aa17}.dot.ok{background:#50ef5e;box-shadow:0 0 8px #50ef5e}.progress{height:5px;border:1px solid #184357;background:#031019;border-radius:99px;overflow:hidden;margin-top:4px}.progress i{display:block;height:100%;width:0;background:#58e9ff;box-shadow:0 0 10px #2ad8ff}.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}.confetti b{position:absolute;top:-15px;animation:fall 1.5s linear forwards}@keyframes fall{to{transform:translateY(700px) rotate(360deg);opacity:0}}@media(max-width:380px){body{padding:7px}.app{height:calc(100dvh - 14px);gap:5px}.screen{padding:11px;border-radius:14px}button{min-height:43px;font-size:11px}.brief{gap:6px}.brief .item{padding:8px}.value{font-size:12px}.character{min-height:135px}}@media(max-height:700px){.title{font-size:25px}.character{min-height:125px}.screen{padding:10px}.brief .item{padding:7px}.controls{gap:5px}button{min-height:40px}.micro{font-size:9px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main class="app"><div class="top"><span>ENCRYPTED TRANSMISSION</span><span id="step">1 / 8</span></div><section id="screen" class="screen"></section><div id="controls" class="controls"></div><div class="status"><span id="dot" class="dot"></span><span id="status">AWAITING DECRYPTION</span><div id="progress" class="progress" hidden><i id="bar"></i></div></div></main><script>(()=>{const s=document.getElementById('screen'),c=document.getElementById('controls'),step=document.getElementById('step'),status=document.getElementById('status'),dot=document.getElementById('dot'),progress=document.getElementById('progress'),bar=document.getElementById('bar');let timer=null;function st(t,ok=false){status.textContent=t;dot.classList.toggle('ok',ok)}function btn(t,cl,f){const b=document.createElement('button');b.textContent=t;b.type='button';if(cl)b.className=cl;b.onclick=f;c.appendChild(b)}function base(n,cls=''){clearInterval(timer);c.className='controls';c.innerHTML='';progress.hidden=true;bar.style.width='0';step.textContent=n+' / 8';s.className='screen '+cls}function show(n){base(n,n===4?'green':n===8?'gold':n===7?'red':'');if(n===1){st('AWAITING DECRYPTION');s.innerHTML='<div class="micro">TAP TO DECRYPT</div><div class="heroLogo">Y</div><div class="title goldText">YOHAAN<br><span style="font-size:.62em;color:#fff">LEVEL 04</span></div><div class="character"></div><div class="panel" style="text-align:center"><b>TOP SECRET INVITATION</b><br><span class="cyan" style="font-size:11px">CLEARANCE: FAMILY & ELITE FRIENDS ONLY</span></div>';btn('TAP ANYWHERE TO DECRYPT','primary',()=>show(2))}if(n===2){st('INITIALISING YOHAAN PROTOCOL…');s.innerHTML='<div class="micro">SYSTEM BOOT</div><div class="title" style="font-size:24px">INITIALISING<br><span class="cyan">YOHAAN PROTOCOL</span></div><div class="bars"><div class="row"><span>POWER CORE</span><span>100%</span><div class="bar"><i></i></div></div><div class="row"><span>NEURAL LINK</span><span>100%</span><div class="bar"><i></i></div></div><div class="row"><span>SECURITY LAYER</span><span>100%</span><div class="bar"><i></i></div></div><div class="row"><span>HOLOGRAPHIC INTERFACE</span><span>100%</span><div class="bar"><i></i></div></div></div><div class="orb"><div class="core"></div></div>';progress.hidden=false;let p=0;timer=setInterval(()=>{p+=4;bar.style.width=p+'%';if(p>=100){clearInterval(timer);st('SYSTEM ONLINE',true);setTimeout(()=>show(3),400)}},50)}if(n===3){st('THUMB SCAN REQUIRED');s.innerHTML='<div class="micro">IDENTITY SCAN</div><div class="title" style="font-size:25px">THUMB SCAN<br><span class="cyan">REQUIRED</span></div><div class="panel" style="margin:auto;width:90%"><div class="finger">☝️</div><div class="scan"></div><p style="text-align:center;font:800 12px ui-monospace">PLACE THUMB ON SCANNER</p></div>';btn('PLACE THUMB / TAP TO SCAN','',()=>{st('VERIFYING AGENT…');setTimeout(()=>show(4),700)})}if(n===4){st('CLEARANCE LEVEL CONFIRMED',true);s.innerHTML='<div class="micro greenText">ACCESS GRANTED</div><div class="title greenText">ACCESS<br>GRANTED</div><div class="shield">Y</div><div class="panel" style="text-align:center;border-color:#2c8f44"><b class="greenText">CLEARANCE LEVEL CONFIRMED</b><br><br>WELCOME TO<br><b>YOHAAN LEVEL 04</b></div>';btn('CONTINUE','success',()=>show(5))}if(n===5){st('INCOMING TRANSMISSION',true);s.innerHTML='<div class="micro">YOHAAN TRANSMISSION</div><div class="title" style="font-size:24px"><span class="cyan">INCOMING TRANSMISSION</span></div><div class="character" style="min-height:220px"></div><div class="panel"><b class="cyan">HELLO TEAM!</b><br><br>I\'M YOHAAN. I HAVE AN IMPORTANT MISSION FOR YOU ON MY LEVEL 04.<br><br>GET READY FOR AN EPIC DAY! SEE YOU THERE!</div>';btn('OPEN MISSION BRIEFING','',()=>show(6))}if(n===6){st('MISSION BRIEFING',true);s.innerHTML='<div class="micro">MISSION BRIEFING</div><div class="title" style="font-size:24px">MISSION BRIEFING</div><div class="character" style="min-height:150px;flex:.7"></div><div class="brief"><div class="item"><div class="label">DATE</div><div class="value">SATURDAY · 5 SEPTEMBER 2026</div></div><div class="item"><div class="label">TIME</div><div class="value">12:30 PM</div></div><div class="item"><div class="label">LOCATION</div><div class="value">1 CLARAFIELD CRESCENT, TARNEIT</div></div><div class="item"><div class="label">DRESS CODE</div><div class="value">SUPERHERO MODE</div></div></div>';btn('CONTINUE TO CONFIRM','',()=>show(7))}if(n===7){st('YOUR RESPONSE REQUIRED',true);s.innerHTML='<div class="micro">CONFIRM MISSION</div><div class="heroLogo" style="color:#ef4c4c">Y</div><div class="title" style="font-size:25px">AGENT!<br>WILL YOU ACCEPT<br>THE MISSION?</div><div class="panel" style="text-align:center;margin-top:auto"><span class="goldText">⚠ THIS MISSION REQUIRES YOUR RESPONSE.</span></div>';c.className='controls two';btn('ACCEPT · I\'M IN','success',()=>show(8));btn('DECLINE','danger',()=>{st('RESPONSE RECEIVED');c.className='controls';c.innerHTML='';btn('VIEW MISSION AGAIN','',()=>show(6))})}if(n===8){st('MISSION CONFIRMED',true);s.innerHTML='<div id="confetti" class="confetti"></div><div class="micro goldText">MISSION CONFIRMED</div><div class="title goldText">MISSION<br>CONFIRMED</div><div class="heroLogo">Y</div><div class="orb" style="border-color:#f2b426;box-shadow:0 0 35px rgba(242,180,38,.35)"><div class="core" style="border-color:#f2b426;box-shadow:0 0 25px #f2b426"></div></div><div class="panel" style="text-align:center;border-color:#8d6716;margin-top:auto"><b class="goldText">THANK YOU AGENT!</b><br>SEE YOU AT THE BASE.<br><br>IT\'S GOING TO BE LEGENDARY!<br><br><i>— Yohaan</i></div>';const cf=document.getElementById('confetti');for(let i=0;i<24;i++){const e=document.createElement('b');e.textContent=['✦','◆','★'][i%3];e.style.left=Math.random()*96+'%';e.style.color=i%2?'#f2b426':'#59eaff';e.style.animationDelay=Math.random()*.4+'s';cf.appendChild(e)}btn('REPLAY INVITATION','',()=>show(1))}}show(1)})();</script></body></html>
