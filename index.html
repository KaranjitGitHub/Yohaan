<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030816"><title>Yohaan // Level 04</title><style>*{box-sizing:border-box}html,body{margin:0;background:#02050d;color:#f7fbff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));overflow:hidden}.app{width:min(100%,430px);height:min(calc(100dvh - 24px),860px);display:grid;grid-template-rows:auto 1fr auto auto;gap:9px}.top{display:flex;justify-content:space-between;align-items:center;color:#9bdfff;font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;padding:0 4px}.screen{position:relative;min-height:0;overflow:hidden;border:1px solid rgba(125,211,252,.5);border-radius:20px;background:radial-gradient(circle at 50% 30%,#0b1e3a,#040916 55%,#01030a 100%);padding:18px;display:flex;flex-direction:column}.screen::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#fff 0.8px,transparent 0.8px),radial-gradient(#86d9ff 0.6px,transparent 0.6px);background-size:28px 28px,42px 42px;background-position:0 0,14px 9px;opacity:.28}.content{position:relative;z-index:2;display:flex;flex-direction:column;min-height:100%;gap:12px}.kicker{text-align:center;color:#8fdcff;font:800 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em}.title{text-align:center;font-weight:900;font-size:clamp(28px,8vw,44px);line-height:.98;margin:0;color:#fff}.subtitle{text-align:center;color:#c7dded;font-size:15px;line-height:1.4;margin:0}.planetScene{position:relative;flex:1;min-height:210px;display:grid;place-items:center}.planet{position:absolute;border-radius:50%}.earth{width:178px;height:178px;background:radial-gradient(circle at 35% 30%,#d9fbff 0 4%,#3aa5ff 18%,#195cba 45%,#08306f 73%,#020919 100%);box-shadow:0 0 38px rgba(63,169,255,.3),inset -24px -16px 40px rgba(0,0,0,.45)}.earth::after{content:"";position:absolute;inset:28px 22px 55px 40px;border-radius:50%;background:#55bb75;filter:blur(1px);transform:rotate(-18deg);opacity:.75}.saturn{width:140px;height:140px;background:radial-gradient(circle at 35% 30%,#ffe6a8,#c99647 45%,#7d4c1f 78%,#21120a 100%);box-shadow:0 0 32px rgba(255,196,87,.2)}.saturn::after{content:"";position:absolute;left:-55px;top:51px;width:250px;height:42px;border:8px solid rgba(233,203,149,.9);border-left-color:rgba(149,106,52,.5);border-right-color:rgba(149,106,52,.5);border-radius:50%;transform:rotate(-12deg)}.mars{width:120px;height:120px;background:radial-gradient(circle at 35% 30%,#ffb07d,#c95d36 50%,#6c2218 82%,#1d0807);box-shadow:0 0 28px rgba(255,102,69,.18)}.moon{width:58px;height:58px;background:radial-gradient(circle at 32% 28%,#f6f8fb,#a6b0be 58%,#525c6a 85%);right:8%;top:14%}.orbit{position:absolute;width:260px;height:110px;border:1px solid rgba(137,215,255,.32);border-radius:50%;transform:rotate(-10deg)}.sun{width:132px;height:132px;background:radial-gradient(circle,#fff7c0 0 8%,#ffd258 25%,#ff8f24 58%,rgba(255,91,20,.35) 80%,transparent 81%);box-shadow:0 0 46px rgba(255,174,49,.35)}.panel{border:1px solid rgba(120,196,232,.35);background:rgba(3,12,25,.82);border-radius:14px;padding:14px;color:#f7fbff}.panel strong{color:#fff}.bigLine{font-size:18px;font-weight:800;line-height:1.35}.muted{color:#c6d8e8}.details{display:grid;gap:10px}.detail{padding:11px 12px;border:1px solid rgba(128,199,235,.28);border-radius:12px;background:rgba(4,15,29,.78)}.label{font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#79dbff;letter-spacing:.12em}.value{font-size:15px;font-weight:800;margin-top:3px;line-height:1.35}.status{text-align:center;font-size:11px;color:#bddff1;min-height:14px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ffbe45;margin-right:6px;box-shadow:0 0 8px #ffbe45}.dot.ok{background:#54e875;box-shadow:0 0 8px #54e875}.controls{display:grid;gap:8px}.controls.two{grid-template-columns:1fr 1fr}button{appearance:none;min-height:48px;border-radius:12px;border:1px solid rgba(122,216,255,.7);background:#08203a;color:#fff;padding:10px 14px;font:900 13px ui-monospace,SFMono-Regular,Menlo,monospace}button.primary{background:#f3b63b;color:#101010;border-color:#ffd76b}button.success{background:#39d96a;color:#041008;border-color:#86f0a3}button.danger{background:#52151e;color:#ffdce0;border-color:#ff6a78}.progress{height:7px;border-radius:99px;background:#071322;border:1px solid rgba(117,199,238,.3);overflow:hidden}.progress i{display:block;height:100%;width:0;background:#68dfff}.scanBox{display:grid;place-items:center;min-height:230px;border:1px solid rgba(111,217,255,.35);border-radius:16px;background:radial-gradient(circle at center,rgba(47,168,255,.15),transparent 65%)}.fingerprint{width:130px;height:160px;border-radius:50%;border:3px solid #68dcff;box-shadow:inset 0 0 25px rgba(72,206,255,.2),0 0 28px rgba(72,206,255,.15);position:relative}.fingerprint::before,.fingerprint::after{content:"";position:absolute;inset:15px;border-radius:50%;border:2px solid rgba(104,220,255,.75)}.fingerprint::after{inset:32px}.scanline{position:absolute;width:160px;height:2px;background:#7be9ff;box-shadow:0 0 12px #7be9ff;animation:scan 1.4s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(-55px)}50%{transform:translateY(55px)}}.check{font-size:72px;color:#60ef7d;text-align:center}.confirmOrb{width:165px;height:165px;border-radius:50%;display:grid;place-items:center;margin:auto;border:2px solid #f3be48;box-shadow:0 0 35px rgba(243,190,72,.25),inset 0 0 25px rgba(243,190,72,.12);font-size:70px;color:#ffd56f}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.confetti b{position:absolute;top:-15px;animation:fall 1.5s linear forwards}@keyframes fall{to{transform:translateY(680px) rotate(360deg);opacity:0}}@media(max-width:380px){body{padding:8px}.app{height:calc(100dvh - 16px);gap:6px}.screen{padding:13px;border-radius:16px}.planetScene{min-height:180px}.earth{width:150px;height:150px}.saturn{width:120px;height:120px}.saturn::after{left:-45px;top:45px;width:210px;height:36px}.details{gap:7px}.detail{padding:9px}.value{font-size:13px}button{min-height:44px;font-size:12px}}@media(max-height:700px){.screen{padding:12px}.planetScene{min-height:150px}.earth{width:130px;height:130px}.saturn{width:105px;height:105px}.saturn::after{left:-38px;top:39px;width:180px;height:30px}.title{font-size:25px}.subtitle{font-size:13px}.panel{padding:10px}.detail{padding:8px}button{min-height:42px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main class="app"><div class="top"><span>YOHAAN // LEVEL 04</span><span id="step">1 / 8</span></div><section id="screen" class="screen"></section><div id="controls" class="controls"></div><div class="status"><span id="dot" class="dot"></span><span id="status">INVITATION LOCKED</span><div id="progress" class="progress" hidden><i id="bar"></i></div></div></main><script>(()=>{const s=document.getElementById('screen'),c=document.getElementById('controls'),step=document.getElementById('step'),status=document.getElementById('status'),dot=document.getElementById('dot'),progress=document.getElementById('progress'),bar=document.getElementById('bar');let timer=null;function st(t,ok=false){status.textContent=t;dot.classList.toggle('ok',ok)}function btn(t,cl,f){const b=document.createElement('button');b.type='button';b.textContent=t;if(cl)b.className=cl;b.addEventListener('click',f);c.appendChild(b)}function base(n){clearInterval(timer);c.innerHTML='';c.className='controls';progress.hidden=true;bar.style.width='0';step.textContent=n+' / 8';s.innerHTML='<div class="content" id="content"></div>';return document.getElementById('content')}function show(n){const x=base(n);if(n===1){st('INVITATION LOCKED');x.innerHTML='<div class="kicker">PRIVATE BIRTHDAY TRANSMISSION</div><h1 class="title">YOHAAN<br>LEVEL 04</h1><p class="subtitle">A special mission from across the solar system is waiting for you.</p><div class="planetScene"><div class="sun"></div><div class="earth" style="left:4%;bottom:1%"></div><div class="moon"></div><div class="orbit"></div></div><div class="panel"><div class="bigLine">Tap below to open your invitation.</div><div class="muted" style="margin-top:6px">For family and friends only.</div></div>';btn('OPEN INVITATION','primary',()=>show(2))}if(n===2){st('STARTING SYSTEM');x.innerHTML='<div class="kicker">SYSTEM STARTUP</div><h1 class="title">PREPARING<br>MISSION</h1><p class="subtitle">Connecting to Yohaan Level 04…</p><div class="planetScene"><div class="saturn"></div><div class="orbit"></div></div><div class="details"><div class="detail"><div class="label">NAVIGATION</div><div class="value">ONLINE</div></div><div class="detail"><div class="label">MISSION LINK</div><div class="value">SECURE</div></div><div class="detail"><div class="label">INVITATION DATA</div><div class="value">READY</div></div></div>';progress.hidden=false;let p=0;timer=setInterval(()=>{p+=5;bar.style.width=p+'%';if(p>=100){clearInterval(timer);st('SYSTEM READY',true);setTimeout(()=>show(3),350)}},45)}if(n===3){st('IDENTITY CHECK');x.innerHTML='<div class="kicker">IDENTITY CHECK</div><h1 class="title">VERIFY<br>GUEST</h1><p class="subtitle">Tap the scanner to continue.</p><div class="scanBox"><div class="fingerprint"></div><div class="scanline"></div></div><div class="panel"><div class="bigLine">No real fingerprint is collected.</div><div class="muted" style="margin-top:6px">This is just part of the birthday mission.</div></div>';btn('TAP TO VERIFY','',()=>{st('VERIFYING…');setTimeout(()=>show(4),650)})}if(n===4){st('ACCESS GRANTED',true);x.innerHTML='<div class="kicker" style="color:#72f093">ACCESS GRANTED</div><h1 class="title" style="color:#6cf48b">YOU’RE IN!</h1><div class="planetScene"><div class="earth"></div><div class="orbit" style="border-color:rgba(103,244,139,.28)"></div></div><div class="check">✓</div><div class="panel"><div class="bigLine">Welcome to Yohaan Level 04.</div><div class="muted" style="margin-top:6px">Your mission briefing is ready.</div></div>';btn('VIEW MESSAGE','success',()=>show(5))}if(n===5){st('MESSAGE RECEIVED',true);x.innerHTML='<div class="kicker">MESSAGE FROM YOHAAN</div><h1 class="title">HELLO!</h1><p class="subtitle">I’m turning four and I’d love you to celebrate with me.</p><div class="planetScene"><div class="mars" style="left:8%;bottom:6%"></div><div class="earth" style="width:120px;height:120px;right:4%;top:4%"></div><div class="moon" style="left:42%;top:18%"></div><div class="orbit"></div></div><div class="panel"><div class="bigLine">Get ready for lunch, fun and a space-sized celebration!</div></div>';btn('SEE PARTY DETAILS','',()=>show(6))}if(n===6){st('MISSION DETAILS',true);x.innerHTML='<div class="kicker">MISSION BRIEFING</div><h1 class="title">PARTY<br>DETAILS</h1><div class="planetScene" style="min-height:150px"><div class="saturn" style="width:110px;height:110px"></div></div><div class="details"><div class="detail"><div class="label">DATE</div><div class="value">Saturday, 5 September 2026</div></div><div class="detail"><div class="label">TIME</div><div class="value">12:30 PM · Lunch celebration</div></div><div class="detail"><div class="label">LOCATION</div><div class="value">1 Clarafield Crescent, Tarneit</div></div><div class="detail"><div class="label">MISSION</div><div class="value">Eat · Play · Laugh · Celebrate</div></div></div>';btn('CONTINUE','',()=>show(7))}if(n===7){st('YOUR RESPONSE NEEDED',true);x.innerHTML='<div class="kicker">FINAL CHECK</div><h1 class="title">CAN YOU<br>JOIN US?</h1><p class="subtitle">Choose your mission response below.</p><div class="planetScene"><div class="earth" style="width:145px;height:145px"></div><div class="moon" style="right:16%;top:22%"></div><div class="orbit"></div></div><div class="panel"><div class="bigLine">Yohaan would love to celebrate with you.</div></div>';c.className='controls two';btn('YES · I’M IN','success',()=>show(8));btn('CAN’T MAKE IT','danger',()=>{st('RESPONSE RECEIVED');c.className='controls';c.innerHTML='';btn('VIEW DETAILS AGAIN','',()=>show(6))})}if(n===8){st('MISSION CONFIRMED',true);x.innerHTML='<div id="confetti" class="confetti"></div><div class="kicker" style="color:#ffd978">MISSION CONFIRMED</div><h1 class="title" style="color:#ffd978">SEE YOU<br>THERE!</h1><div class="planetScene"><div class="sun"></div><div class="orbit" style="border-color:rgba(255,211,105,.34)"></div></div><div class="confirmOrb">✓</div><div class="panel"><div class="bigLine">Saturday, 5 September · 12:30 PM</div><div class="muted" style="margin-top:6px">1 Clarafield Crescent, Tarneit</div><div style="margin-top:12px;font-weight:800;color:#ffd978">— Yohaan</div></div>';const cf=document.getElementById('confetti');for(let i=0;i<22;i++){const e=document.createElement('b');e.textContent=['✦','★','●'][i%3];e.style.left=Math.random()*96+'%';e.style.color=i%2?'#ffd66a':'#83dcff';e.style.animationDelay=Math.random()*.4+'s';cf.appendChild(e)}btn('REPLAY INVITATION','',()=>show(1))}}show(1)})();</script></body></html>
