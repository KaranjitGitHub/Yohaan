top"><span>ENCRYPTED TRANSMISSION</span><span id="step">1 / 8</span></div><section id="screen" class="screen"></section><div id="controls" class="controls"></div><div class="status"><span id="dot" class="dot"></span><span id="status">AWAITING DECRYPTION</span><div id="progress" class="progress" hidden><i id="bar"></i></div></div></main><script>(()=>{const s=document.getElementById('screen'),c=document.getElementById('controls'),step=document.getElementById('step'),status=document.getElementById('status'),dot=document.getElementById('dot'),progress=document.getElementById('progress'),bar=document.getElementById('bar');let timer=null;function st(t,ok=false){status.textContent=t;dot.classList.toggle('ok',ok)}function btn(t,cl,f){const b=document.createElement('button');b.textContent=t;b.type='button';if(cl)b.className=cl;b.onclick=f;c.appendChild(b)}function art(){return '<div class="art"><div class="city"></div><div class="moon"></div><div class="kid"><div class="head"><div class="hair"></div><i class="eye e1"></i><i class="eye e2"></i><i class="smile"></i></div><div class="suit"></div><div class="arm al"></div><div class="arm ar"></div><div class="leg ll"></div><div class="leg lr"></div><div class="core"></div></div><div class="bot"><div class="bh"><div class="bs"><i class="be b1"></i><i class="be b2"></i></div></div><div class="bb"></div></div></div>'}function base(n,cls=''){clearInterval(timer);c.className='controls';c.innerHTML='';progress.hidden=true;bar.style.width='0';step.textContent=n+' / 8';s.className='screen '+cls}function show(n){base(n,n===4?'green':n===8?'gold':n===7?'red':'');if(n===1){st('AWAITING DECRYPTION');s.innerHTML='<div class="micro">TAP TO DECRYPT</div><div class="heroLogo">Y</div><div class="title goldT">YOHAAN<br><span style="font-size:.62em;color:#fff">LEVEL 04</span></div>'+art()+'<div class="panel" style="text-align:center"><b>TOP SECRET INVITATION</b><br><span class="cyan" style="font-size:11px">CLEARANCE: FAMILY & ELITE FRIENDS ONLY</s
