<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02070d"><title>Yohaan // Level 04</title><style>*{box-sizing:border-box}html,body{margin:0;background:#02070d;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));overflow:hidden}.app{width:min(100%,430px);height:min(calc(100dvh - 24px),880px);display:grid;grid-template-rows:auto 1fr auto auto;gap:8px}.top{display:flex;justify-content:space-between;align-items:center;color:#82eaff;font:800 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;padding:2px 2px}.frame{position:relative;overflow:hidden;border:1px solid #25cfff;border-radius:18px;background:linear-gradient(180deg,#05131d,#02070d);box-shadow:0 0 28px rgba(37,207,255,.15);min-height:0}.frame img{width:100%;height:100%;object-fit:contain;display:block;background:#02070d}.hud{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(54,215,255,.07),transparent 20%,transparent 80%,rgba(54,215,255,.07));mix-blend-mode:screen}.scanline{position:absolute;left:9%;right:9%;height:2px;background:#5ceaff;box-shadow:0 0 14px #35d8ff;animation:scan 1.45s ease-in-out infinite;display:none}.scanning .scanline{display:block}@keyframes scan{0%,100%{top:20%}50%{top:80%}}.flash{position:absolute;inset:0;background:radial-gradient(circle,rgba(72,227,255,.35),transparent 55%);opacity:0}.flash.on{animation:flash .55s ease}@keyframes flash{45%{opacity:1}}.controls{display:grid;gap:8px}.controls.two{grid-template-columns:1fr 1fr}button{appearance:none;border:1px solid #26d8ff;border-radius:12px;min-height:48px;padding:10px 14px;background:#062033;color:#f8fbff;font:900 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;box-shadow:inset 0 0 14px rgba(38,216,255,.08)}button.primary{background:#f5b51a;color:#0b0b0b;border-color:#ffd65b}button.success{background:#42db24;color:#041204;border-color:#97ff78}button.danger{background:#50120e;color:#ffd5d0;border-color:#ff6c53}.status{text-align:center;color:#c4f3ff;font-size:11px;min-height:16px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#f0a500;box-shadow:0 0 8px #f0a500}.dot.ok{background:#4be32d;box-shadow:0 0 8px #4be32d}.progress{height:5px;background:#06141e;border:1px solid #214a5d;border-radius:99px;overflow:hidden;margin-top:4px}.progress i{display:block;height:100%;width:0;background:#57e8ff;box-shadow:0 0 12px #36d8ff}.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}.confetti b{position:absolute;top:-20px;animation:fall 1.6s linear forwards}@keyframes fall{to{transform:translateY(700px) rotate(360deg);opacity:0}}@media(max-width:390px){body{padding:8px}.app{height:calc(100dvh - 16px);gap:6px}.frame{border-radius:14px}button{min-height:44px;font-size:12px;padding:8px 10px}.top{font-size:10px}}@media(max-height:700px){.top{font-size:9px}.app{gap:5px}button{min-height:42px}.status{font-size:10px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main class="app"><div class="top"><span>ENCRYPTED TRANSMISSION</span><span id="step">1 / 8</span></div><div id="frame" class="frame"><img id="art" alt="Yohaan Level 04 birthday mission"><div class="hud"></div><div class="scanline"></div><div id="flash" class="flash"></div><div id="confetti" class="confetti"></div></div><div id="controls" class="controls"></div><div class="status"><span id="dot" class="dot"></span><span id="status">AWAITING DECRYPTION</span><div id="progress" class="progress" hidden><i id="bar"></i></div></div></main><script>(()=>{const frame=document.getElementById('frame'),art=document.getElementById('art'),controls=document.getElementById('controls'),step=document.getElementById('step'),status=document.getElementById('status'),dot=document.getElementById('dot'),progress=document.getElementById('progress'),bar=document.getElementById('bar'),flash=document.getElementById('flash'),confetti=document.getElementById('confetti');let timer=null;const imgs=[];function setStatus(t,ok=false){status.textContent=t;dot.classList.toggle('ok',ok)}function pulse(){flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on')}function btn(t,c,f){const b=document.createElement('button');b.type='button';b.textContent=t;if(c)b.className=c;b.addEventListener('click',f);controls.appendChild(b)}function confettiGo(){confetti.innerHTML='';const a=['✦','◆','●','★','✧'];for(let i=0;i<26;i++){const e=document.createElement('b');e.textContent=a[i%a.length];e.style.left=(Math.random()*96)+'%';e.style.color=i%3===0?'#56eaff':i%3===1?'#ffd15a':'#64ef4e';e.style.animationDelay=(Math.random()*.5)+'s';confetti.appendChild(e)}setTimeout(()=>confetti.innerHTML='',1900)}function show(n){clearInterval(timer);frame.classList.remove('scanning');controls.className='controls';controls.innerHTML='';progress.hidden=true;bar.style.width='0';art.src=imgs[n-1];step.textContent=n+' / 8';if(n===1){setStatus('AWAITING DECRYPTION');btn('TAP TO DECRYPT','primary',()=>show(2))}if(n===2){setStatus('INITIALISING YOHAAN PROTOCOL…');progress.hidden=false;let p=0;timer=setInterval(()=>{p+=4;bar.style.width=p+'%';setStatus(p<45?'POWER CORE ONLINE…':p<80?'NEURAL LINK + SECURITY…':'MISSION SYSTEM READY…');if(p>=100){clearInterval(timer);setStatus('SYSTEM ONLINE',true);pulse();setTimeout(()=>show(3),450)}},55)}if(n===3){setStatus('THUMB SCAN REQUIRED');frame.classList.add('scanning');btn('PLACE THUMB / TAP TO SCAN','',()=>{setStatus('VERIFYING AGENT…');pulse();setTimeout(()=>show(4),800)})}if(n===4){setStatus('CLEARANCE LEVEL CONFIRMED',true);btn('CONTINUE','success',()=>show(5))}if(n===5){setStatus('INCOMING TRANSMISSION',true);btn('OPEN MISSION BRIEFING','',()=>show(6))}if(n===6){setStatus('MISSION BRIEFING',true);btn('CONTINUE TO CONFIRM','',()=>show(7))}if(n===7){setStatus('YOUR RESPONSE REQUIRED',true);controls.className='controls two';btn('ACCEPT · I’M IN','success',()=>{pulse();show(8);confettiGo()});btn('DECLINE','danger',()=>{setStatus('RESPONSE RECEIVED');controls.className='controls';controls.innerHTML='';btn('VIEW MISSION AGAIN','',()=>show(6))})}if(n===8){setStatus('MISSION CONFIRMED',true);btn('REPLAY INVITATION','',()=>show(1))}}show(1)})();</script></body></html>
