<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02070d"><title>Yohaan // Level 04</title><style>*{box-sizing:border-box}html,body{margin:0;background:#02070d;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:8px}.app{width:min(100%,560px)}.shell{overflow:hidden;border:1px solid #12bff0;border-radius:18px;background:#04101a;box-shadow:0 0 30px rgba(18,191,240,.15)}.top{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #163e52;color:#84ebff;font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}.stage{position:relative;background:#02070d;display:grid;place-items:center;overflow:hidden}.sprite{width:100%;aspect-ratio:432/910;background:url('invite.webp') top center/100% auto no-repeat}.crop{width:100%;overflow:hidden;position:relative}.controls{display:grid;gap:8px;padding:9px;background:#020b12;border-top:1px solid #14394d}button{appearance:none;min-height:46px;border-radius:10px;border:1px solid #2bd9ff;background:#062033;color:#fff;padding:10px 14px;font:900 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}button.primary{background:#f4b51a;color:#111;border-color:#ffd15a}button.success{background:#4add27;color:#041204;border-color:#9aff7b}button.danger{background:#54150f;color:#ffd8d3;border-color:#ff6a50}.status{padding:0 8px 8px;text-align:center;font-size:11px;color:#beeefe}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#f0a500;box-shadow:0 0 8px #f0a500}.dot.ok{background:#4be32d;box-shadow:0 0 8px #4be32d}.scan{position:absolute;left:8%;right:8%;height:2px;background:#63e9ff;box-shadow:0 0 15px #31d9ff;animation:scan 1.5s ease-in-out infinite}@keyframes scan{0%,100%{top:18%}50%{top:82%}}@media(max-width:420px){body{padding:3px}.shell{border-radius:12px}.controls{padding:7px}button{min-height:44px;font-size:12px}}</style></head><body><main class="app"><div class="shell"><div class="top"><span>ENCRYPTED TRANSMISSION</span><span id="step">1 / 7</span></div><div id="stage" class="stage"></div><div id="controls" class="controls"></div><div class="status"><span id="dot" class="dot"></span><span id="status">AWAITING DECRYPTION</span></div></div></main><script>(()=>{const stage=document.getElementById('stage'),controls=document.getElementById('controls'),step=document.getElementById('step'),status=document.getElementById('status'),dot=document.getElementById('dot');let timer=null;const regions=[{x:0,y:0,w:432,h:226},{x:0,y:222,w:205,h:181},{x:203,y:222,w:229,h:181},{x:0,y:398,w:205,h:188},{x:203,y:398,w:229,h:188},{x:0,y:581,w:205,h:177},{x:203,y:581,w:229,h:177},{x:0,y:752,w:432,h:158}];function setStatus(t,ok=false){status.textContent=t;dot.classList.toggle('ok',ok)}function button(t,c,f){const b=document.createElement('button');b.type='button';b.textContent=t;if(c)b.className=c;b.onclick=f;controls.appendChild(b)}function show(n){clearInterval(timer);controls.innerHTML='';const r=regions[n-1],scale=432/r.w;stage.style.height=(r.h*scale)+'px';stage.innerHTML=`<div style="position:absolute;width:${432*scale}px;height:${910*scale}px;left:${-r.x*scale}px;top:${-r.y*scale}px;background:url('invite.webp') top left/100% 100% no-repeat"></div>`;step.textContent=n<=7?n+' / 7':'MISSION COMPLETE';if(n===1){setStatus('AWAITING DECRYPTION');button('TAP TO DECRYPT  »','primary',()=>show(2))}if(n===2){setStatus('INITIALISING SYSTEM…');let p=0;timer=setInterval(()=>{p+=5;setStatus(p<50?'INITIALISING SYSTEM…':p<90?'LOADING MISSION FILES…':'SECURE CHANNEL READY…');if(p>=100){clearInterval(timer);setStatus('SYSTEM ONLINE',true);setTimeout(()=>show(3),350)}},55)}if(n===3){setStatus('IDENTITY SCAN');stage.insertAdjacentHTML('beforeend','<div class="scan"></div>');button('PLACE THUMB / TAP TO SCAN','',()=>{setStatus('VERIFYING AGENT');setTimeout(()=>show(4),750)})}if(n===4){setStatus('ACCESS GRANTED',true);button('RECEIVE TRANSMISSION','success',()=>show(5))}if(n===5){setStatus('INCOMING TRANSMISSION',true);button('OPEN MISSION BRIEFING  »','',()=>show(6))}if(n===6){setStatus('MISSION BRIEFING',true);button('CONTINUE TO ACCEPT MISSION','',()=>show(7))}if(n===7){setStatus('AWAITING YOUR RESPONSE',true);button('✓  YES, I’M IN!','success',()=>show(8));button('✕  SORRY, CAN’T MAKE IT','danger',()=>{setStatus('RESPONSE RECEIVED');controls.innerHTML='';button('VIEW MISSION AGAIN','',()=>show(6));button('REPLAY FROM START','',()=>show(1))})}if(n===8){setStatus('MISSION CONFIRMED',true);button('REPLAY INVITATION','',()=>show(1))}}show(1)})();</script></body></html>
